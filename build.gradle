plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'arn'
version = '0.3.1'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

dependencies {
    // Bundle the native libraries for all three supported x64 desktop platforms.
    ['base', 'controls', 'fxml', 'graphics'].each { module ->
        ['win', 'mac', 'linux'].each { platform ->
            implementation "org.openjfx:javafx-${module}:17.0.19:${platform}"
        }
    }

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        events 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

test {
    exclude '**/PackagedApplicationTest.class'
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

application {
    mainClass = 'arn.Launcher'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes 'Implementation-Title': 'Arn', 'Implementation-Version': project.version
    }
}

shadowJar {
    archiveFileName = 'Arn.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
}

tasks.register('jarSmokeTest', Test) {
    description = 'Runs the fat JAR in a separate JVM and verifies its contents.'
    group = 'verification'
    dependsOn shadowJar, testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/PackagedApplicationTest.class'
    systemProperty 'arn.jar', tasks.shadowJar.archiveFile.get().asFile.absolutePath
    systemProperty 'arn.version', project.version.toString()
    systemProperty 'arn.uiReport', layout.buildDirectory.dir('reports/ui-smoke').get().asFile.absolutePath
    inputs.file tasks.shadowJar.archiveFile
    shouldRunAfter test
}

check {
    dependsOn jarSmokeTest
}

run {
    standardInput = System.in
}
