name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew clean check shadowJar --warning-mode fail

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean check shadowJar --warning-mode fail

      - name: Build and test (macOS)
        if: runner.os == 'macOS'
        run: ./gradlew clean check shadowJar --warning-mode fail

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ matrix.os }}
          path: build/reports/
          if-no-files-found: warn

      - name: Upload runnable application
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arn-application
          path: build/libs/Arn.jar
          if-no-files-found: error
