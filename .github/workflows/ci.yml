name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: xvfb-run --auto-servernum ./gradlew clean check shadowJar

      - name: Upload runnable application
        uses: actions/upload-artifact@v4
        with:
          name: arn-application
          path: build/libs/Arn.jar
          if-no-files-found: error
